name: CI/CD

# 部署前在仓库 Settings 中配置：
#   Variables: COS_BUCKET, COS_REGION, COS_PREFIX
#   Secrets:   COS_SECRET_ID, COS_SECRET_KEY
# 未配置 Variables 时，Deploy job 会自动跳过，只跑 Check & Build。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check & validate content
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: Deploy
    needs: build
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.COS_BUCKET != '' &&
      vars.COS_REGION != '' &&
      vars.COS_PREFIX != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install COS CLI
        run: |
          set -euo pipefail
          python3 -m venv .venv-cos
          .venv-cos/bin/pip install --disable-pip-version-check coscmd

      - name: Configure COS credentials
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
        run: |
          set -euo pipefail
          if [ -z "${COS_SECRET_ID}" ] || [ -z "${COS_SECRET_KEY}" ]; then
            echo "Missing COS_SECRET_ID / COS_SECRET_KEY secrets."
            exit 1
          fi
          .venv-cos/bin/coscmd config \
            -a "${COS_SECRET_ID}" \
            -s "${COS_SECRET_KEY}" \
            -b "${COS_BUCKET}" \
            -r "${COS_REGION}"

      - name: Upload dist
        env:
          COS_PREFIX: ${{ vars.COS_PREFIX }}
        run: |
          set -euo pipefail
          if [ -z "${COS_PREFIX}" ] || [ "${COS_PREFIX}" = "/" ]; then
            echo "COS_PREFIX must point to a project directory, not the bucket root."
            exit 1
          fi
          prefix="/${COS_PREFIX#/}"
          prefix="${prefix%/}"
          .venv-cos/bin/coscmd upload -rs --delete -f -y dist/ "${prefix}/"
